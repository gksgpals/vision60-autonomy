# Full-system mock state estimation.
#
# On the real robot this stage fuses GLIM /slam/odom with the Vision 60 body
# odometry. In the mock chain the only motion source is the bridge transport,
# so /vision60/odom is the single input and the filter owns odom -> base_link.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    print_diagnostics: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /vision60/odom
    odom0_config:
      [true,  true,  false,
       false, false, true,
       true,  false, false,
       false, false, true,
       false, false, false]
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false
