controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /slam/odom
    speed_limit_topic: /speed_limit
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      # The recovery path starts behind the robot, so the rotation shim
      # turns in place first and produces no translation for several
      # seconds. 10 s aborted that turn before it finished.
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      # DWB does not rotate in place to pick up a path that starts behind
      # the robot; it spirals out and oscillates. The recorded recovery
      # route always starts behind the robot, so the official Nav2 shim
      # rotates to the path heading first and then hands over to DWB.
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0
      min_vel_x: 0.0
      max_vel_x: 0.30
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.60
      min_speed_xy: 0.0
      max_speed_xy: 0.30
      min_speed_theta: 0.0
      acc_lim_x: 0.50
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.50
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      BaseObstacle.scale: 0.02
      PathAlign.scale: 16.0
      GoalAlign.scale: 12.0
      PathDist.scale: 16.0
      GoalDist.scale: 12.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.40
      plugins: [inflation_layer]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.30, 0.0, 0.60]
    min_velocity: [-0.30, 0.0, -0.60]
    max_accel: [0.50, 0.0, 1.0]
    max_decel: [-0.50, 0.0, -1.0]
    odom_topic: /slam/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [controller_server, velocity_smoother, collision_monitor]
